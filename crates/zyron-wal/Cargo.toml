[package]
name = "zyron-wal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
zyron-common = { path = "../zyron-common" }
thiserror.workspace = true
serde.workspace = true
bytes.workspace = true
parking_lot = "0.12"
# Engine underneath parking_lot (already in the tree). Used directly for
# futex / WaitOnAddress style address-based parking on the flushed-LSN atomic:
# a committer awaiting durability parks on that address with no mutex, no
# per-waiter allocation, and no polling timer; the flusher wakes by address.
parking_lot_core = "0.9"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27"
zyron-bench-harness = { path = "../zyron-bench-harness" }
