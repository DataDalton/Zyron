[package]
name = "zyron-executor"
edition.workspace = true
rust-version.workspace = true

[features]
# Compiles in the wall-clock phase profiler scopes (zyron-common::profile).
# Off by default; enable for a bench run, then set ZYRON_PROFILE at runtime.
profile = ["zyron-common/profile"]

[dependencies]
zyron-common = { path = "../zyron-common" }
zyron-parser = { path = "../zyron-parser" }
zyron-catalog = { path = "../zyron-catalog" }
zyron-lake = { path = "../zyron-lake" }
zyron-planner = { path = "../zyron-planner" }
zyron-storage = { path = "../zyron-storage" }
zyron-wal = { path = "../zyron-wal" }
zyron-buffer = { path = "../zyron-buffer" }
zyron-auth = { path = "../zyron-auth" }
zyron-search = { path = "../zyron-search" }
zyron-analytics = { path = "../zyron-analytics" }
zyron-types = { path = "../zyron-types" }
tokio.workspace = true
hashbrown.workspace = true
parking_lot.workspace = true
scc.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
rand = "0.10"
zyron-bench-harness = { path = "../zyron-bench-harness" }
