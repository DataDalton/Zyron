[package]
name = "zyron-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
zyron-mesh = { path = "../zyron-mesh" }
zyron-raft = { path = "../zyron-raft" }
zyron-pressure = { path = "../zyron-pressure" }
zyron-common = { path = "../zyron-common" }
inventory.workspace = true
zyron-media = { path = "../zyron-media" }
zyron-buffer = { path = "../zyron-buffer" }
zyron-wal = { path = "../zyron-wal" }
zyron-storage = { path = "../zyron-storage" }
zyron-catalog = { path = "../zyron-catalog" }
zyron-lake = { path = "../zyron-lake" }
zyron-lifecycle = { path = "../zyron-lifecycle" }
zyron-wire = { path = "../zyron-wire" }
zyron-auth = { path = "../zyron-auth" }
zyron-cdc = { path = "../zyron-cdc" }
zyron-pipeline = { path = "../zyron-pipeline" }
zyron-streaming = { path = "../zyron-streaming" }
zyron-versioning = { path = "../zyron-versioning" }
zyron-executor = { path = "../zyron-executor" }
zyron-search = { path = "../zyron-search" }
zyron-analytics = { path = "../zyron-analytics" }
zyron-types = { path = "../zyron-types" }
zyron-parser = { path = "../zyron-parser" }
zyron-planner = { path = "../zyron-planner" }
tokio.workspace = true
# The driver asks every member of the group what it runs at the same time
futures.workspace = true
bytes.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
scc.workspace = true
parking_lot.workspace = true
crossbeam.workspace = true
sha2.workspace = true
socket2.workspace = true
base64.workspace = true
# The format migration budget is measured against the node's memory and
# the free space on the data volume
sysinfo.workspace = true
# Release manifests and binaries are signed by the vendor with Ed25519 and
# checked against the key built into this binary. The signing half is what
# zyron-ctl release sign uses, and keygen draws a new seed from the OS
ed25519-dalek.workspace = true
rand.workspace = true
# The release feed is fetched over HTTPS. rustls only, no system TLS stack
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[features]
# Compiles in the phase profiler across the build (zyron-common::profile). Pass
# --features profile to a bench run, then set ZYRON_PROFILE at runtime.
profile = [
    "zyron-common/profile",
    "zyron-wire/profile",
    "zyron-executor/profile",
]

[dev-dependencies]
tempfile = "3"
# Stands in for a Discord webhook so the embed body, the 429 retry-after
# path, and its cap are exercised against a real HTTP answer
httpmock = "0.7"
# Writes the Parquet fixture the conformance suite points an external source
# at. Pinned to the version zyron-streaming reads with, so the test exercises
# the reader this build ships
parquet = { version = "55", default-features = false, features = ["arrow"] }
arrow = { version = "55", default-features = false }
sha2.workspace = true
zyron-bench-harness = { path = "../zyron-bench-harness" }
sysinfo.workspace = true
