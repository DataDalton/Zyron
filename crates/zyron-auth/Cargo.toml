[package]
name = "zyron-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
zyron-common = { path = "../zyron-common" }
inventory.workspace = true
zyron-catalog = { path = "../zyron-catalog" }
zyron-storage = { path = "../zyron-storage" }
zyron-buffer = { path = "../zyron-buffer" }
zyron-wal = { path = "../zyron-wal" }
scc.workspace = true
regex = "1"
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
base64.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
p256.workspace = true
ed25519-dalek.workspace = true
ring.workspace = true
# RSA key generation only, and the signature the RS256 verifier tests check
# against. Signing and verification both run through ring, whose modular
# arithmetic is constant time. RUSTSEC-2023-0071 is a timing sidechannel in
# this crate's private key operations, reachable only by an attacker who can
# time them, so the operations it covers are never called here. Generation is
# a one-shot local computation that answers no attacker query
rsa = { version = "0.9", features = ["sha2"] }
# Wipes secret key halves on drop and on rotation, so a retired private key
# does not stay readable in freed heap
zeroize = { version = "1.8", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
# default-features is off on all three to keep the AWS SDK's legacy `rustls`
# feature out. That feature resolves to aws-smithy-http-client's
# legacy-rustls-ring, which pulls a second whole TLS stack (rustls 0.21,
# hyper 0.14, h2 0.3) alongside the rustls 0.23 that default-https-client
# already provides, and both then get compiled
aws-sdk-sts = { version = "1", default-features = false, features = [
    "sigv4a",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-config = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
mimalloc.workspace = true
zyron-bench-harness = { path = "../zyron-bench-harness" }
httpmock = "0.7"
