[package]
name = "zyron-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
# Compiles in the wall-clock phase profiler scopes (zyron-common::profile).
# Off by default; enable for a bench run, then set ZYRON_PROFILE at runtime.
profile = ["zyron-common/profile"]

[dependencies]
zyron-common = { path = "../zyron-common" }
zyron-parser = { path = "../zyron-parser" }
zyron-catalog = { path = "../zyron-catalog" }
zyron-planner = { path = "../zyron-planner" }
zyron-lifecycle = { path = "../zyron-lifecycle" }
zyron-executor = { path = "../zyron-executor" }
zyron-storage = { path = "../zyron-storage" }
zyron-wal = { path = "../zyron-wal" }
zyron-buffer = { path = "../zyron-buffer" }
zyron-auth = { path = "../zyron-auth" }
zyron-cdc = { path = "../zyron-cdc" }
zyron-pipeline = { path = "../zyron-pipeline" }
zyron-streaming = { path = "../zyron-streaming" }
zyron-versioning = { path = "../zyron-versioning" }
zyron-search = { path = "../zyron-search" }
zyron-analytics = { path = "../zyron-analytics" }
zyron-types = { path = "../zyron-types" }
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
thiserror.workspace = true
md-5.workspace = true
sha2.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
base64.workspace = true
rand.workspace = true
itoa.workspace = true
ryu.workspace = true
socket2.workspace = true
crossbeam.workspace = true
parking_lot.workspace = true
mimalloc.workspace = true
tokio-quiche.workspace = true
futures.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
async-trait.workspace = true
scc.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr = "2"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
md-5 = { workspace = true }
tokio-util.workspace = true
futures.workspace = true
rcgen.workspace = true
zyron-bench-harness = { path = "../zyron-bench-harness" }
