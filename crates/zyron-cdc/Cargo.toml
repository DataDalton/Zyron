[package]
name = "zyron-cdc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
zyron-common = { path = "../zyron-common" }
zyron-wal = { path = "../zyron-wal" }
zyron-storage = { path = "../zyron-storage" }
zyron-catalog = { path = "../zyron-catalog" }
zyron-buffer = { path = "../zyron-buffer" }
tokio = { workspace = true }
parking_lot = { workspace = true }
scc = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rskafka = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
apache-avro = "0.19"

[dev-dependencies]
tempfile = "3"
zyron-bench-harness = { path = "../zyron-bench-harness" }
