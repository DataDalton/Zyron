[package]
name = "zyron-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
zyron-common = { path = "../zyron-common" }
zyron-buffer = { path = "../zyron-buffer" }
zyron-wal = { path = "../zyron-wal" }
tokio.workspace = true
parking_lot.workspace = true
crossbeam.workspace = true
bytes.workspace = true
hashbrown.workspace = true
scc.workspace = true
xxhash-rust.workspace = true

[features]
# Compiles in the phase profiler across the build (zyron-common::profile). Pass
# --features profile to a bench run, then set ZYRON_PROFILE at runtime.
profile = ["zyron-common/profile"]

[dev-dependencies]
tempfile = "3.27.0"
rand = "0.10"
zyron-bench-harness = { path = "../zyron-bench-harness" }
mimalloc.workspace = true
