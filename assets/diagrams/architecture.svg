<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" width="100%" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Zyron crate layering">
  <title>Zyron crate layering</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="980" fill="#0d1117" rx="6"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Zyron workspace · Each crate owns one layer · Depends only on the layers beneath it</text>

  <!-- Layer arrows (drawn first, cluster boxes are transparent so these show through the gaps) -->
  <g stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="480" y1="130" x2="480" y2="154"/>
    <line x1="480" y1="234" x2="480" y2="258"/>
    <line x1="480" y1="338" x2="480" y2="362"/>
    <line x1="480" y1="458" x2="480" y2="482"/>
    <line x1="480" y1="578" x2="480" y2="602"/>
    <line x1="480" y1="734" x2="480" y2="758"/>
    <line x1="480" y1="854" x2="480" y2="878"/>
  </g>

  <!-- Layer 1: Clients -->
  <rect x="40" y="50" width="880" height="80" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="66" fill="#8b949e" font-size="11">Clients</text>
  <rect x="60" y="76" width="268" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="194" y="103" text-anchor="middle" font-size="13"><tspan fill="#e6edf3" font-weight="600">psql</tspan><tspan fill="#a371f7"> · Drivers · SDKs</tspan></text>
  <rect x="344" y="76" width="268" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="478" y="103" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-cli</text>
  <rect x="628" y="76" width="268" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="762" y="103" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-ctl</text>

  <!-- Layer 2: Connectivity -->
  <rect x="40" y="154" width="880" height="80" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="170" fill="#8b949e" font-size="11">Connectivity</text>
  <rect x="60" y="180" width="840" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="480" y="207" text-anchor="middle" font-size="13"><tspan fill="#e6edf3" font-weight="600">zyron-wire</tspan><tspan fill="#a371f7"> · PostgreSQL v3 · TCP + QUIC · TLS 1.3 · COPY · Auth · Pooling</tspan></text>

  <!-- Layer 3: Orchestration -->
  <rect x="40" y="258" width="880" height="80" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="274" fill="#8b949e" font-size="11">Orchestration</text>
  <rect x="60" y="284" width="840" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="480" y="311" text-anchor="middle" font-size="13"><tspan fill="#e6edf3" font-weight="600">zyron-server</tspan><tspan fill="#a371f7"> · Sessions · Background workers · Backup · Upgrade driver</tspan></text>

  <!-- Layer 4: Distribution -->
  <rect x="40" y="362" width="880" height="96" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="378" fill="#8b949e" font-size="11">Distribution</text>
  <rect x="60" y="388" width="268" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="194" y="412" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-raft</text>
  <text x="194" y="434" text-anchor="middle" fill="#a371f7" font-size="12">Consensus · Log · Snapshot · Membership</text>
  <rect x="344" y="388" width="268" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="478" y="412" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-mesh</text>
  <text x="478" y="434" text-anchor="middle" fill="#a371f7" font-size="12">Peer RPC · Drain · Warm pool</text>
  <rect x="628" y="388" width="268" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="762" y="412" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-pressure</text>
  <text x="762" y="434" text-anchor="middle" fill="#a371f7" font-size="12">Load adaptation · Actuator ladder</text>

  <!-- Layer 5: Query path -->
  <rect x="40" y="482" width="880" height="96" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="498" fill="#8b949e" font-size="11">Query path</text>
  <rect x="60" y="508" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="159" y="532" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-parser</text>
  <text x="159" y="554" text-anchor="middle" fill="#a371f7" font-size="12">Recursive descent · Pratt</text>
  <rect x="274" y="508" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="373" y="532" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-planner</text>
  <text x="373" y="554" text-anchor="middle" fill="#a371f7" font-size="12">Binder · Cost-based optimizer</text>
  <rect x="488" y="508" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="587" y="532" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-executor</text>
  <text x="587" y="554" text-anchor="middle" fill="#a371f7" font-size="12">Vectorized · Morsel-parallel</text>
  <rect x="702" y="508" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="801" y="532" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-catalog</text>
  <text x="801" y="554" text-anchor="middle" fill="#a371f7" font-size="12">Schemas · Stats · DDL</text>

  <!-- Layer 6: Native subsystems -->
  <rect x="40" y="602" width="880" height="132" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="618" fill="#8b949e" font-size="11">Native subsystems</text>
  <rect x="60" y="628" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="139" y="655" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-auth</text>
  <rect x="230" y="628" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="309" y="655" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-versioning</text>
  <rect x="400" y="628" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="479" y="655" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-cdc</text>
  <rect x="570" y="628" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="649" y="655" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-search</text>
  <rect x="740" y="628" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="819" y="655" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-analytics</text>
  <rect x="60" y="680" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="139" y="707" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-pipeline</text>
  <rect x="230" y="680" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="309" y="707" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-lifecycle</text>
  <rect x="400" y="680" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="479" y="707" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-streaming</text>
  <rect x="570" y="680" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="649" y="707" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-types</text>
  <rect x="740" y="680" width="158" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="819" y="707" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-media</text>

  <!-- Layer 7: Storage engine -->
  <rect x="40" y="758" width="880" height="96" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="774" fill="#8b949e" font-size="11">Storage engine</text>
  <rect x="60" y="784" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="159" y="808" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-storage</text>
  <text x="159" y="830" text-anchor="middle" fill="#a371f7" font-size="12">Heap · B+tree · .zyr · MVCC</text>
  <rect x="274" y="784" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="373" y="808" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-lake</text>
  <text x="373" y="830" text-anchor="middle" fill="#a371f7" font-size="12">Versioned .zyr · Log · Manifest</text>
  <rect x="488" y="784" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="587" y="808" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-buffer</text>
  <text x="587" y="830" text-anchor="middle" fill="#a371f7" font-size="12">Clock-sweep pool</text>
  <rect x="702" y="784" width="198" height="60" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="801" y="808" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">zyron-wal</text>
  <text x="801" y="830" text-anchor="middle" fill="#a371f7" font-size="12">Ring buffer · Group commit</text>

  <!-- Layer 8: Common -->
  <rect x="40" y="878" width="880" height="80" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="894" fill="#8b949e" font-size="11">Foundation</text>
  <rect x="60" y="904" width="840" height="44" rx="6" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="480" y="931" text-anchor="middle" font-size="13"><tspan fill="#e6edf3" font-weight="600">zyron-common</tspan><tspan fill="#a371f7"> · Errors · Pages · Hashing · PRNG · Format envelope · Registries</tspan></text>
</svg>
